<title>Day Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ── Design tokens ── */
:root {
  --bg: #F5F4F0;
  --surface: #FFFFFF;
  --surface-raised: #FAFAF8;
  --border: #E2E0DA;
  --border-subtle: #EDECE8;
  --text: #18181B;
  --text-muted: #71717A;
  --text-faint: #A1A1AA;
  --accent: #4059E5;
  --accent-soft: #EEF0FD;
  --accent-hover: #3147C8;
  --high: #E5380A;
  --high-soft: #FEF0EC;
  --med: #D97706;
  --med-soft: #FFFBEB;
  --low: #059669;
  --low-soft: #ECFDF5;
  --done-alpha: 0.45;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0E14;
    --surface: #16181F;
    --surface-raised: #1C1F29;
    --border: #2A2D3A;
    --border-subtle: #22252F;
    --text: #E8E9EE;
    --text-muted: #8B8FA8;
    --text-faint: #5A5E74;
    --accent: #6B7FF5;
    --accent-soft: #1A1E40;
    --accent-hover: #8596F8;
    --high: #F8755A;
    --high-soft: #2A1210;
    --med: #F5A623;
    --med-soft: #2A1F0A;
    --low: #34D399;
    --low-soft: #072318;
    --shadow: 0 1px 3px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.18);
    --shadow-lg: 0 4px 16px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0E14;
  --surface: #16181F;
  --surface-raised: #1C1F29;
  --border: #2A2D3A;
  --border-subtle: #22252F;
  --text: #E8E9EE;
  --text-muted: #8B8FA8;
  --text-faint: #5A5E74;
  --accent: #6B7FF5;
  --accent-soft: #1A1E40;
  --accent-hover: #8596F8;
  --high: #F8755A;
  --high-soft: #2A1210;
  --med: #F5A623;
  --med-soft: #2A1F0A;
  --low: #34D399;
  --low-soft: #072318;
  --shadow: 0 1px 3px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.18);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.22);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

body {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── App layout ── */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0 12px;
  flex-shrink: 0;
  gap: 12px;
}

.app-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
  margin: 0;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-icon {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: background .15s, color .15s, border-color .15s;
  box-shadow: var(--shadow);
  padding: 0;
}
.btn-icon:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn-icon svg { display: block; flex-shrink: 0; }

.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 0 14px;
  height: 34px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: background .15s, box-shadow .15s;
  box-shadow: var(--shadow);
}
.btn-primary:hover { background: var(--accent-hover); }

.app-body {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 16px;
  min-height: 0;
  padding-bottom: 16px;
}

/* ── Tasks panel ── */
.tasks-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 10px;
}

.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  box-shadow: var(--shadow);
}
.filter-chip:hover { color: var(--accent); border-color: var(--accent); }
.filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.tasks-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 2px;
}
.tasks-scroll::-webkit-scrollbar { width: 4px; }
.tasks-scroll::-webkit-scrollbar-track { background: transparent; }
.tasks-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.task-group-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 6px 0 2px;
}

.task-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 12px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  position: relative;
}
.task-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); }
.task-card.done { opacity: var(--done-alpha); }
.task-card.done .task-title { text-decoration: line-through; }

.task-check {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  background: transparent;
}
.task-check:hover { border-color: var(--accent); }
.task-check.checked { background: var(--accent); border-color: var(--accent); }
.task-check.checked::after {
  content: '';
  display: block;
  width: 5px;
  height: 8px;
  border: 1.5px solid #fff;
  border-top: none;
  border-left: none;
  transform: rotate(45deg) translate(-1px, -1px);
}

.task-body { flex: 1; min-width: 0; }
.task-title {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
  word-break: break-word;
}
.task-meta {
  display: flex;
  gap: 8px;
  margin-top: 5px;
  flex-wrap: wrap;
  align-items: center;
}
.task-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.task-date.overdue { color: var(--high); }
.task-date.today { color: var(--accent); font-weight: 500; }

.task-category {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--border-subtle);
  color: var(--text-muted);
}

.priority-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
}
.priority-dot.high { background: var(--high); }
.priority-dot.medium { background: var(--med); }
.priority-dot.low { background: var(--low); }

.task-delete {
  opacity: 0;
  background: none;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  padding: 2px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  transition: opacity .15s, color .15s;
  flex-shrink: 0;
}
.task-card:hover .task-delete { opacity: 1; }
.task-delete:hover { color: var(--high); }

.empty-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-faint);
}
.empty-state svg { opacity: .35; margin-bottom: 12px; }
.empty-state p { margin: 0; font-size: 13px; }

/* ── Calendar panel ── */
.calendar-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.calendar-widget {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  flex-shrink: 0;
}

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
}

.cal-month {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.cal-nav {
  display: flex;
  gap: 4px;
}

.cal-nav-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  background: var(--surface-raised);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all .15s;
  padding: 0;
}
.cal-nav-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 0 10px 12px;
  gap: 2px;
}

.cal-dow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-faint);
  text-align: center;
  padding: 4px 0;
}

.cal-day {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .12s;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  gap: 2px;
  padding: 2px 0;
}
.cal-day:empty { cursor: default; }
.cal-day:not(:empty):hover { background: var(--accent-soft); color: var(--accent); }
.cal-day.today { color: var(--accent); font-weight: 700; }
.cal-day.today .cal-day-num { background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.cal-day.other-month { color: var(--text-faint); opacity: .5; }
.cal-day.selected { background: var(--accent-soft); }
.cal-day.selected .cal-day-num { color: var(--accent); }

.cal-day-num { font-size: 12.5px; line-height: 1; }

.cal-dots {
  display: flex;
  gap: 2px;
  justify-content: center;
}
.cal-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
}
.cal-dot.high { background: var(--high); }
.cal-dot.medium { background: var(--med); }
.cal-dot.low { background: var(--low); }
.cal-dot.done { background: var(--text-faint); }

/* ── Mini upcoming ── */
.upcoming-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.upcoming-header {
  padding: 12px 14px 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .3px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.upcoming-list {
  overflow-y: auto;
  flex: 1;
  padding: 6px 0;
}
.upcoming-list::-webkit-scrollbar { width: 3px; }
.upcoming-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.upcoming-item {
  display: flex;
  gap: 10px;
  padding: 7px 14px;
  align-items: center;
  transition: background .12s;
  cursor: pointer;
}
.upcoming-item:hover { background: var(--surface-raised); }

.upcoming-date-col {
  flex-shrink: 0;
  width: 32px;
  text-align: center;
}
.upcoming-day-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.upcoming-day-label {
  font-size: 9px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: 2px;
}
.upcoming-title {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.upcoming-prio {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.upcoming-empty {
  padding: 20px 14px;
  color: var(--text-faint);
  font-size: 12px;
  text-align: center;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  backdrop-filter: blur(2px);
}
.modal-overlay[hidden] { display: none !important; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 440px;
  overflow: hidden;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.2px;
}

.modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer {
  padding: 12px 20px 18px;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: .2px; }

.field input, .field select, .field textarea {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  font-size: 13.5px;
  color: var(--text);
  font-family: inherit;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb, 64, 89, 229), .12);
}
.field textarea { resize: vertical; min-height: 70px; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-cancel {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 16px;
  height: 36px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-muted);
  transition: all .15s;
}
.btn-cancel:hover { border-color: var(--accent); color: var(--accent); }

.btn-save {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 0 20px;
  height: 36px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-save:hover { background: var(--accent-hover); }

/* ── Responsive ── */
@media (max-width: 680px) {
  .app-body { grid-template-columns: 1fr; }
  .calendar-panel { order: -1; }
  .upcoming-section { min-height: 160px; }
}
@media (max-width: 400px) {
  .app-title { font-size: 16px; }
}
</style>

<!-- Modal -->
<div class="modal-overlay" id="modal" hidden aria-modal="true" role="dialog">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">New Task</h2>
      <button class="btn-icon" id="modal-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label" for="task-title">Title</label>
        <input type="text" id="task-title" placeholder="What needs to be done?" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label" for="task-notes">Notes</label>
        <textarea id="task-notes" placeholder="Any details…" rows="2"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="task-date">Due date</label>
          <input type="date" id="task-date">
        </div>
        <div class="field">
          <label class="field-label" for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="task-category">Category</label>
        <select id="task-category">
          <option value="">None</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Health">Health</option>
          <option value="Finance">Finance</option>
          <option value="Learning">Learning</option>
          <option value="Home">Home</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-save" id="modal-save">Add Task</button>
    </div>
  </div>
</div>

<!-- App -->
<div class="app">
  <header class="app-header">
    <h1 class="app-title">Day Planner</h1>
    <div class="header-actions">
      <button class="btn-icon" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1v1M7.5 13v1M1 7.5H0M15 7.5h-1M2.93 2.93l.7.7M11.37 11.37l.7.7M2.93 12.07l.7-.7M11.37 3.63l.7-.7M7.5 5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="btn-primary" id="new-task-btn">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New Task
      </button>
    </div>
  </header>

  <div class="app-body">
    <!-- Tasks panel -->
    <section class="tasks-panel">
      <div class="filter-bar" id="filter-bar">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="today">Today</button>
        <button class="filter-chip" data-filter="upcoming">Upcoming</button>
        <button class="filter-chip" data-filter="done">Done</button>
      </div>
      <div class="tasks-scroll" id="task-list" role="list"></div>
    </section>

    <!-- Calendar panel -->
    <aside class="calendar-panel">
      <div class="calendar-widget">
        <div class="cal-header">
          <span class="cal-month" id="cal-month"></span>
          <div class="cal-nav">
            <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M6.5 1.5L3 5l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="cal-nav-btn" id="cal-today-btn" title="Go to today" aria-label="Today">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4 1v2M8 1v2M1 5h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
            <button class="cal-nav-btn" id="cal-next" aria-label="Next month">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3.5 1.5L7 5l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="upcoming-section">
        <div class="upcoming-header" id="upcoming-header">Upcoming Tasks</div>
        <div class="upcoming-list" id="upcoming-list"></div>
      </div>
    </aside>
  </div>
</div>

<script>
(function() {
'use strict';

// ── State ──
const TODAY = (() => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
})();

let state = {
  tasks: [],
  filter: 'all',
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  selectedDay: null,
  editId: null,
  theme: null
};

function loadState() {
  try {
    const raw = localStorage.getItem('dayplanner_v2');
    if (raw) {
      const saved = JSON.parse(raw);
      state.tasks = saved.tasks || [];
      state.theme = saved.theme || null;
    }
  } catch(e) {}

  if (!state.tasks.length) {
    // Seed with examples
    const d = new Date();
    const fmt = (offset) => {
      const x = new Date(d);
      x.setDate(x.getDate() + offset);
      return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    };
    state.tasks = [
      { id: uid(), title: 'Finish project proposal', notes: 'Include budget breakdown', due: fmt(0), priority: 'high', category: 'Work', done: false, created: Date.now()-4000 },
      { id: uid(), title: 'Team standup', notes: '', due: fmt(0), priority: 'medium', category: 'Work', done: true, created: Date.now()-3000 },
      { id: uid(), title: 'Gym session', notes: '', due: fmt(1), priority: 'medium', category: 'Health', done: false, created: Date.now()-2000 },
      { id: uid(), title: 'Review Q4 budget', notes: '', due: fmt(3), priority: 'high', category: 'Finance', done: false, created: Date.now()-1000 },
      { id: uid(), title: 'Read "Deep Work"', notes: 'Chapter 3 onwards', due: fmt(5), priority: 'low', category: 'Learning', done: false, created: Date.now() },
    ];
  }
}

function saveState() {
  try {
    localStorage.setItem('dayplanner_v2', JSON.stringify({ tasks: state.tasks, theme: state.theme }));
  } catch(e) {}
}

function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// ── Theme ──
function applyTheme() {
  if (state.theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else if (state.theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const current = state.theme;
  const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  state.theme = isDark ? 'light' : 'dark';
  applyTheme();
  saveState();
});

// ── Filters ──
document.getElementById('filter-bar').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  state.filter = chip.dataset.filter;
  state.selectedDay = null;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
  renderTasks();
  renderCalendar();
});

// ── Task CRUD ──
function getFilteredTasks() {
  if (state.selectedDay) {
    return state.tasks.filter(t => t.due === state.selectedDay).sort(taskSort);
  }
  const now = new Date();
  const todayStr = TODAY;
  switch(state.filter) {
    case 'today':
      return state.tasks.filter(t => t.due === todayStr && !t.done).sort(taskSort);
    case 'upcoming':
      return state.tasks.filter(t => t.due && t.due > todayStr && !t.done).sort(taskSort);
    case 'done':
      return state.tasks.filter(t => t.done).sort((a,b) => b.created - a.created);
    default:
      return [...state.tasks].sort(taskSort);
  }
}

function taskSort(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if (a.due && b.due) return a.due.localeCompare(b.due);
  if (a.due) return -1;
  if (b.due) return 1;
  return b.created - a.created;
}

function formatDate(due) {
  if (!due) return '';
  const [y, m, d] = due.split('-').map(Number);
  const today = new Date(); today.setHours(0,0,0,0);
  const dueDate = new Date(y, m-1, d);
  const diff = Math.round((dueDate - today) / 86400000);
  if (diff < 0) return { label: `${Math.abs(diff)}d overdue`, cls: 'overdue' };
  if (diff === 0) return { label: 'Today', cls: 'today' };
  if (diff === 1) return { label: 'Tomorrow', cls: '' };
  if (diff < 7) return { label: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dueDate.getDay()], cls: '' };
  return { label: dueDate.toLocaleDateString('en', {month:'short', day:'numeric'}), cls: '' };
}

// ── Render tasks ──
function renderTasks() {
  const list = document.getElementById('task-list');
  const tasks = getFilteredTasks();
  if (!tasks.length) {
    list.innerHTML = `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect x="6" y="8" width="28" height="26" rx="4" stroke="currentColor" stroke-width="2"/><path d="M13 20h14M13 14h8M13 26h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <p>${state.selectedDay ? 'No tasks on this day.' : 'No tasks here yet.'}</p>
    </div>`;
    return;
  }

  // Group by date for "all" filter
  let html = '';
  if (state.filter === 'all' && !state.selectedDay) {
    const overdue = tasks.filter(t => !t.done && t.due && t.due < TODAY);
    const todayT = tasks.filter(t => !t.done && t.due === TODAY);
    const upcoming = tasks.filter(t => !t.done && t.due && t.due > TODAY);
    const noDate = tasks.filter(t => !t.done && !t.due);
    const done = tasks.filter(t => t.done);
    if (overdue.length) { html += `<div class="task-group-label">Overdue</div>`; overdue.forEach(t => { html += taskHTML(t); }); }
    if (todayT.length) { html += `<div class="task-group-label">Today</div>`; todayT.forEach(t => { html += taskHTML(t); }); }
    if (upcoming.length) { html += `<div class="task-group-label">Upcoming</div>`; upcoming.forEach(t => { html += taskHTML(t); }); }
    if (noDate.length) { html += `<div class="task-group-label">Anytime</div>`; noDate.forEach(t => { html += taskHTML(t); }); }
    if (done.length) { html += `<div class="task-group-label">Completed</div>`; done.forEach(t => { html += taskHTML(t); }); }
  } else {
    tasks.forEach(t => { html += taskHTML(t); });
  }

  list.innerHTML = html;

  list.querySelectorAll('.task-check').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); toggleDone(el.dataset.id); });
  });
  list.querySelectorAll('.task-delete').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); deleteTask(el.dataset.id); });
  });
  list.querySelectorAll('.task-card').forEach(el => {
    el.addEventListener('click', () => openEdit(el.dataset.id));
  });
}

function taskHTML(t) {
  const dateInfo = t.due ? formatDate(t.due) : null;
  const priorityLabel = t.priority || 'medium';
  return `<div class="task-card${t.done ? ' done' : ''}" data-id="${t.id}" role="listitem">
    <div class="priority-dot ${priorityLabel}"></div>
    <button class="task-check${t.done ? ' checked' : ''}" data-id="${t.id}" aria-label="${t.done ? 'Mark incomplete' : 'Mark complete'}"></button>
    <div class="task-body">
      <div class="task-title">${escHtml(t.title)}</div>
      <div class="task-meta">
        ${dateInfo ? `<span class="task-date ${dateInfo.cls}">${dateInfo.label}</span>` : ''}
        ${t.category ? `<span class="task-category">${escHtml(t.category)}</span>` : ''}
      </div>
    </div>
    <button class="task-delete" data-id="${t.id}" aria-label="Delete task">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 1.5l10 10M11.5 1.5l-10 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>`;
}

function toggleDone(id) {
  const t = state.tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; saveState(); renderTasks(); renderCalendar(); renderUpcoming(); }
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState(); renderTasks(); renderCalendar(); renderUpcoming();
}

// ── Calendar ──
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function renderCalendar() {
  const { calYear, calMonth } = state;
  document.getElementById('cal-month').textContent = `${MONTHS[calMonth]} ${calYear}`;

  const grid = document.getElementById('cal-grid');
  const todayParts = TODAY.split('-').map(Number);
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  // Build dot map
  const dotMap = {};
  state.tasks.forEach(t => {
    if (!t.due) return;
    const [y,m,d] = t.due.split('-').map(Number);
    if (y === calYear && m-1 === calMonth) {
      if (!dotMap[d]) dotMap[d] = [];
      dotMap[d].push(t);
    }
  });

  let html = DAYS.map(d => `<div class="cal-dow">${d}</div>`).join('');

  // Previous month cells
  for (let i = 0; i < firstDay; i++) {
    const day = daysInPrev - firstDay + i + 1;
    html += `<div class="cal-day other-month"><span class="cal-day-num">${day}</span></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso === TODAY;
    const isSelected = iso === state.selectedDay;
    const dots = dotMap[d] || [];

    const dotsHtml = dots.slice(0,3).map(t =>
      `<span class="cal-dot ${t.done ? 'done' : (t.priority||'medium')}"></span>`
    ).join('');

    html += `<div class="cal-day${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-iso="${iso}">
      <span class="cal-day-num">${d}</span>
      ${dots.length ? `<div class="cal-dots">${dotsHtml}</div>` : ''}
    </div>`;
  }

  // Fill remaining
  const total = firstDay + daysInMonth;
  const remaining = (7 - (total % 7)) % 7;
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="cal-day other-month"><span class="cal-day-num">${d}</span></div>`;
  }

  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day[data-iso]').forEach(el => {
    el.addEventListener('click', () => {
      const iso = el.dataset.iso;
      if (state.selectedDay === iso) {
        state.selectedDay = null;
        // Reset filter chips
        document.querySelectorAll('.filter-chip').forEach(c =>
          c.classList.toggle('active', c.dataset.filter === state.filter));
      } else {
        state.selectedDay = iso;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      }
      renderTasks();
      renderCalendar();
    });
  });
}

document.getElementById('cal-prev').addEventListener('click', () => {
  if (state.calMonth === 0) { state.calMonth = 11; state.calYear--; }
  else state.calMonth--;
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  if (state.calMonth === 11) { state.calMonth = 0; state.calYear++; }
  else state.calMonth++;
  renderCalendar();
});
document.getElementById('cal-today-btn').addEventListener('click', () => {
  const now = new Date();
  state.calYear = now.getFullYear(); state.calMonth = now.getMonth();
  state.selectedDay = null;
  document.querySelectorAll('.filter-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.filter === state.filter));
  renderCalendar(); renderTasks();
});

// ── Upcoming list ──
function renderUpcoming() {
  const container = document.getElementById('upcoming-list');
  const header = document.getElementById('upcoming-header');

  const upcoming = state.tasks
    .filter(t => !t.done && t.due && t.due >= TODAY)
    .sort((a,b) => a.due.localeCompare(b.due))
    .slice(0, 12);

  if (!upcoming.length) {
    container.innerHTML = `<p class="upcoming-empty">No upcoming tasks.</p>`;
    header.textContent = 'Upcoming Tasks';
    return;
  }

  header.textContent = `Upcoming — ${upcoming.length} task${upcoming.length !== 1 ? 's' : ''}`;
  container.innerHTML = upcoming.map(t => {
    const [y,m,d] = t.due.split('-').map(Number);
    const dateObj = new Date(y, m-1, d);
    const dayNum = d;
    const dayLabel = ['SUN','MON','TUE','WED','THU','FRI','SAT'][dateObj.getDay()];
    return `<div class="upcoming-item" data-id="${t.id}">
      <div class="upcoming-date-col">
        <div class="upcoming-day-num">${String(dayNum).padStart(2,'0')}</div>
        <div class="upcoming-day-label">${dayLabel}</div>
      </div>
      <span class="upcoming-title">${escHtml(t.title)}</span>
      <span class="upcoming-prio" style="background:var(--${t.priority||'med'})"></span>
    </div>`;
  }).join('');

  container.querySelectorAll('.upcoming-item').forEach(el => {
    el.addEventListener('click', () => openEdit(el.dataset.id));
  });
}

// ── Modal ──
const modal = document.getElementById('modal');
const modalTitleEl = document.getElementById('modal-title');
const titleInput = document.getElementById('task-title');
const notesInput = document.getElementById('task-notes');
const dateInput = document.getElementById('task-date');
const priorityInput = document.getElementById('task-priority');
const categoryInput = document.getElementById('task-category');
const saveBtn = document.getElementById('modal-save');

function openModal(prefillDate) {
  state.editId = null;
  modalTitleEl.textContent = 'New Task';
  saveBtn.textContent = 'Add Task';
  titleInput.value = '';
  notesInput.value = '';
  dateInput.value = prefillDate || (state.selectedDay || '');
  priorityInput.value = 'medium';
  categoryInput.value = '';
  modal.hidden = false;
  titleInput.focus();
}

function openEdit(id) {
  const t = state.tasks.find(t => t.id === id);
  if (!t) return;
  state.editId = id;
  modalTitleEl.textContent = 'Edit Task';
  saveBtn.textContent = 'Save Changes';
  titleInput.value = t.title;
  notesInput.value = t.notes || '';
  dateInput.value = t.due || '';
  priorityInput.value = t.priority || 'medium';
  categoryInput.value = t.category || '';
  modal.hidden = false;
  titleInput.focus();
}

function closeModal() {
  modal.hidden = true;
  state.editId = null;
}

document.getElementById('new-task-btn').addEventListener('click', () => openModal());
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openModal(); }
});

saveBtn.addEventListener('click', saveTask);
document.getElementById('modal').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target !== notesInput) saveTask();
});

function saveTask() {
  const title = titleInput.value.trim();
  if (!title) { titleInput.focus(); titleInput.style.borderColor = 'var(--high)'; setTimeout(() => titleInput.style.borderColor = '', 1000); return; }

  if (state.editId) {
    const t = state.tasks.find(t => t.id === state.editId);
    if (t) {
      t.title = title;
      t.notes = notesInput.value.trim();
      t.due = dateInput.value || null;
      t.priority = priorityInput.value;
      t.category = categoryInput.value;
    }
  } else {
    state.tasks.push({
      id: uid(),
      title,
      notes: notesInput.value.trim(),
      due: dateInput.value || null,
      priority: priorityInput.value,
      category: categoryInput.value,
      done: false,
      created: Date.now()
    });
  }

  saveState(); closeModal();
  renderTasks(); renderCalendar(); renderUpcoming();
}

// ── Util ──
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
loadState();
applyTheme();
renderTasks();
renderCalendar();
renderUpcoming();

})();
</script>
