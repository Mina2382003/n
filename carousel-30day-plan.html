/* ── Brand carousel tokens ── */
:root {

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}

/* ── Shell ── */

.hd-t{font-size:14px;font-weight:700}.hd-s{font-size:11px;color:var(--tx2);margin-top:1px}
.prog{font-size:11px;color:var(--copper);font-weight:600}
.tabs{display:flex;gap:6px;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--brd);flex-shrink:0;overflow-x:auto;background:var(--surf);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 13px;border-radius:20px;border:1.5px solid var(--brd2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;color:var(--tx2);background:none;font-family:'Inter',sans-serif}
.tab[data-c="all"].on{border-color:var(--copper);background:rgba(196,122,62,.18);color:var(--copper)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}

.card{background:var(--surf);border:1.5px solid var(--brd);border-radius:8px;padding:14px 15px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:7px}

.card.posted{opacity:.45}
.card-top{display:flex;align-items:center;gap:7px}
.dn{font-size:11px;font-weight:700;color:var(--tx3);min-width:36px}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.cdot[data-c="r"]{background:var(--cat-r)} .cdot[data-c="o"]{background:var(--cat-o)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 32px;gap:14px}

.stage{position:relative;width:400px;height:500px;max-width:min(400px,calc(100vw - 32px));aspect-ratio:4/5;flex-shrink:0}
.sld{position:absolute;inset:0;overflow:hidden;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .32s ease}
.sld.on{opacity:1;pointer-events:auto}

/* Slide backgrounds */
.sl-c{background:var(--cream);color:var(--dark)}
.sl-d{background:var(--dark);color:var(--cream)}
.sl-k{background:var(--copper);color:var(--cream)}

/* Pills — exact from standalone */

.pill-cu{background:var(--copper);color:var(--cream)}
.pill-dk{background:var(--dark);color:var(--cream);border:1px solid var(--cop-mid)}
.pill-ou{border:1px solid var(--copper);color:var(--copper);background:transparent}
.pill-cr{background:var(--cream);color:var(--dark)}

/* Halo — exact from standalone */
.halo{position:absolute;border-radius:50%;background-image:radial-gradient(circle,currentColor var(--hd,1.4px),transparent var(--hd,1.4px));background-size:var(--hs,9px) var(--hs,9px);-webkit-mask-image:radial-gradient(ellipse var(--hmx,85%) var(--hmy,85%) at center,black 0%,rgba(0,0,0,.75) 35%,rgba(0,0,0,.38) 60%,transparent 78%);mask-image:radial-gradient(ellipse var(--hmx,85%) var(--hmy,85%) at center,black 0%,rgba(0,0,0,.75) 35%,rgba(0,0,0,.38) 60%,transparent 78%)}
/* Halo positions */
.ha-br{right:-60px;bottom:-60px;width:230px;height:230px}
.ha-bl{left:-60px;bottom:-60px;width:230px;height:230px}
.ha-tr{right:-30px;top:-30px;width:180px;height:180px}

.ring{position:absolute;width:48px;height:48px;border-radius:50%;border:2px solid var(--copper);display:flex;align-items:center;justify-content:center;color:var(--copper);font-size:18px;opacity:.65}
.ri-tr{top:38px;right:32px} .ri-bl{bottom:38px;left:32px}

/* Slide inner */
.si{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1;padding:30px 32px 34px;font-family:'Barlow',system-ui,sans-serif}
.si-bot{justify-content:flex-end}
.si-top{justify-content:flex-start}

/* Typography */
.sh1{font-size:28px;font-weight:300;font-style:italic;line-height:1;margin-bottom:4px}
.sh2-lg{font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.91;margin-bottom:20px}
.sh2-sm{font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.03;margin-bottom:11px}
.ssub{font-size:10px;opacity:.62;font-style:italic;line-height:1.45;margin-bottom:16px}
.sbody{font-size:11px;line-height:1.65;opacity:.85}

// ── Renderer — uses same CSS classes as standalone carousels ────────────────
function pill(text, pc) {
  const cls = {cu:'pill-cu', dk:'pill-dk', ou:'pill-ou', cr:'pill-cr'}[pc||'cu'];
  return `<span class="pill ${cls}">${text}</span>`;
}
function renderSlide(s) {
  const bgCls = {c:'sl-c', d:'sl-d', k:'sl-k'}[s.b];
  const isCover = !!s.h1;
  const isMid = s.b === 'd';
  const isCopper = s.b === 'k';

  // Ghost
  const gColor = isMid ? 'rgba(196,122,62,.13)' : isCopper ? 'rgba(26,10,14,.18)' : 'rgba(196,122,62,.1)';
  const ghost = s.g ? `<div style="position:absolute;top:8px;right:16px;font-size:${s.gs||98}px;font-weight:900;line-height:1;color:${gColor};user-select:none;letter-spacing:-.03em;pointer-events:none;font-family:'Barlow',sans-serif">${s.g}</div>` : '';

  // Halo
  const haloCols = {c:'var(--copper)', d:'rgba(196,122,62,.22)', k:'rgba(26,10,14,.2)'};
  const halo = s.ha ? `<div class="halo ha-${s.ha}" style="color:${haloCols[s.b]};--hs:10px;--hd:1.5px"></div>` : '';

  // Ring
  const ring = s.ri ? `<div class="ring ri-${s.ri}">↗</div>` : '';

  // Pill
  const pc = s.pc || (isCopper ? 'dk' : 'cu');
  const pillHtml = s.p ? `<div class="spm">${pill(s.p, pc)}</div>` : '';

  // Headlines
  let heads = '';
  if (s.h1 && s.h2) {
    const sz = s.hs2 || 60;
    const mb = s.sub ? 10 : 20;
    heads = `<div class="sh1">${s.h1}</div><div class="sh2-lg" style="font-size:${sz}px;margin-bottom:${mb}px">${s.h2.replace(/\n/g,'<br>')}</div>`;
  } else if (s.h2) {
    const sz = s.hs2 || 24;
    heads = `<div class="sh2-sm" style="font-size:${sz}px">${s.h2.replace(/\n/g,'<br>')}</div>`;
  }

  // Sub + Body
  const subHtml = s.sub ? `<div class="ssub">${s.sub}</div>` : '';
  let bodyHtml = '';
  if (Array.isArray(s.bd)) {
    bodyHtml = `<div class="sbody-list">${s.bd.map(b=>`<div>${b}</div>`).join('')}</div>`;
  } else if (s.bd) {
    bodyHtml = `<div class="sbody">${s.bd}</div>`;
  }

  const innerCls = isCover ? 'si si-bot' : 'si si-top';
  const pt = isCover ? 36 : 28;
  return `<div class="${bgCls}" style="position:absolute;inset:0;overflow:hidden;border-radius:5px">${ghost}${halo}${ring}<div class="${innerCls}" style="padding-top:${pt}px">${pillHtml}${heads}${subHtml}${bodyHtml}</div></div>`;
}

 {b:'k',p:'THE BIGGER PROBLEM',h2:'LOCKED TO ONE LOCATION.',bd:"Your regular who moves across town stops coming. Traditional loyalty doesn't follow the guest — it follows the postcode."},
 {b:'d',p:'THE RESERVYA MODEL',h2:'LOYALTY THAT LIVES IN THE BOOKING.',bd:"Every reservation builds points automatically. No card. No app to download. No friction. Just value every time they return.",g:'0'},
 {b:'c',p:'THE SHIFT',h1:'Effortless.',h2:'AUTOMATIC\nRETURN.',sub:"Guests don't want to manage loyalty. They want to feel it.",ha:'bl',ri:'tr'}
],caption:`Real question: when's the last time a loyalty stamp card actually made you go back to a restaurant?\n\nNow think about what actually brings you back. It's not the stamp — it's the feeling of being recognized.\n\nHere's what actually works (and why the old model is finished). 👇\n\n#CustomerLoyalty #RestaurantBusiness #GuestRetention #Reservya #LoyaltyProgram`},
{day:15,cat:'p',title:"New Competitor Opens, You Have No Defense",time:'Sun · 7:00 PM',
slides:[
 {b:'c',p:'PROBLEM 08',h1:'New place\nopened',h2:'ACROSS THE\nSTREET.',sub:"Your regulars are curious. That's not disloyalty — it's human nature.",g:'NEW',gs:52,ha:'br',ri:'tr'},
 {b:'d',p:'THE VULNERABILITY',h2:'YOUR REGULARS WILL TRY IT.',bd:"The question isn't whether they'll try the new place — they will. The question is whether you'll know if they don't come back.",g:'?'},
 {b:'k',p:'WHAT YOU NEED',h2:'WHEN DID YOUR REGULARS LAST VISIT?',bd:"If you can't answer this question for your top 50 guests, you have no early warning system for drift."},
 {b:'d',p:'THE RESERVYA EDGE',h2:'VISIT FREQUENCY TRACKING.',bd:"When a regular breaks their normal pattern, the system flags it. Send a personalized note at day 30 — not day 90.",g:'30'},
 {b:'c',p:'THE PLAY',h1:'Know before',h2:'THEY\nLEAVE.',sub:'Your data is your defense. Use it to act early, not reactively.',ha:'bl'}
],caption:`Every restaurant will face a new competitor eventually. The ones who survive it aren't necessarily the ones with the best food — they're the ones who know their guests well enough to reach out before it's too late. 🛡️\n\n#RestaurantStrategy #CompetitiveAdvantage #Reservya #HospitalityBusiness #GuestRetention`},
{day:17,cat:'p',title:"Your Best Customers Disappear Silently",time:'Tue · 7:00 PM',
slides:[
 {b:'c',p:'PROBLEM 09',h1:'Table 7 hasn\'t',h2:'BEEN BACK\nIN 60 DAYS.',sub:"They didn't complain. They just stopped.",g:'60',ha:'br'},
 {b:'d',p:'THE SILENCE',h2:'90% OF UNHAPPY GUESTS NEVER SAY ANYTHING.',bd:"They simply choose somewhere else. And you'll never know why unless you track when they stopped coming.",g:'90%'},
 {b:'k',p:'THE PATTERN',h2:'GUEST LOSS SIGNALS ITSELF EARLY.',bd:"A monthly regular misses one month. Then two. By month three, they're someone else's regular. The window was month one."},
 {b:'d',p:'THE RESERVYA FIX',h2:'AUTOMATED LAPSE DETECTION.',bd:"When a guest breaks their normal pattern, the system flags it. A personalized re-engagement at day 30 wins back 3× more than one at day 90.",g:'30'},
 {b:'c',p:'THE WINDOW',h1:'Act at 30 days.',h2:'NOT\n90.',sub:'The difference between "we miss you" and "too late" is timing.',ha:'bl',ri:'tr'}
],caption:`The scariest thing in hospitality isn't bad reviews — it's the guests who leave quietly and never tell you why.\n\nI track when my best customers stop coming. Most owners don't — and that's exactly why competitor opens sting so much.\n\nHere's how I know when a regular is drifting before it's too late 👇\n\n#GuestRetention #RestaurantBusiness #CustomerExperience #Reservya #Churn`},
{day:19,cat:'p',title:"One Platform Change Wiped Your Orders",time:'Thu · 7:00 PM',
slides:[
 {b:'c',p:'PROBLEM 10',h1:'Algorithm\nchanged.',h2:'REVENUE\nDROPPED 40%.',sub:'In a week. With no warning.',g:'40%',gs:60,ha:'br'},
 {b:'d',p:'THE DEPENDENCY',h2:'BUILT ON SOMEONE ELSE\'S PLATFORM.',bd:"When your restaurant's survival depends on one app's algorithm, you've handed control to their product team.",g:'APP'},
 {b:'k',p:'THE RISK',h2:'THEY DON\'T OWN THE RELATIONSHIP.',bd:"Every order that comes through them is proof you don't control your own demand. One policy change and your livelihood shifts."},
 {b:'d',p:'THE STRATEGY',h2:'OWN YOUR CHANNELS. BUILD YOUR LIST.',bd:"A direct booking system, an email list, a loyalty base — these can't be algorithm'd away. They're yours, permanently.",g:'OWN'},
 {b:'c',p:'THE PRINCIPLE',h1:'Don\'t rent',h2:'YOUR\nAUDIENCE.',sub:'Build what can\'t be taken. Guest data, direct relationships, your own channel.',ha:'bl'}
],caption:`In 2023, one algorithm change on a major food app wiped out 40%+ of orders for restaurants who'd built their whole model on it. No warning. No compensation.\n\nThis is exactly why owning your direct channel isn't optional anymore. 📉\n\n#RestaurantBusiness #BusinessRisk #DirectMarketing #Reservya #HospitalityStrategy #PlatformRisk`},
// TIPS
{day:2,cat:'t',title:"The 3-Second Table Impression",time:'Mon · 7:00 PM',
slides:[
 {b:'c',p:'TIP 01',h1:'Guests decide in',h2:'3 SECONDS.',sub:"Here's what they're judging before they even sit down.",g:'3',gs:140,ha:'br'},
 {b:'d',p:'WHAT THEY SEE',h2:'TABLE SETTING.',bd:"Fingerprints on glass. Uneven cutlery. A crooked centerpiece. These tiny details read as 'we don't care about the details'.",g:'👁'},
 {b:'k',p:'WHAT THEY HEAR',h2:'AMBIENT SOUND.',bd:"Too loud = can't talk. Too quiet = feels awkward. The right volume says 'we thought about this'. Check it at every service."},
 {b:'d',p:'WHAT THEY FEEL',h2:'TEMPERATURE + SCENT.',bd:"Cold draft from AC hitting the wrong spot. Kitchen smell hitting wrong. First impressions live in the body before the brain.",g:'~'},
 {b:'c',p:'THE STANDARD',h1:'Walk the room',h2:'BEFORE EVERY\nSERVICE.',sub:'Sit at every table. See what your guests see. 3 seconds is all you get.',ha:'bl',ri:'tr'}
],caption:`I walked into a restaurant last week and knew in 3 seconds it was going to be a bad experience — before anyone had spoken to me.\n\nHere's the pre-service checklist that changes this. Walk the room. Every time. 👇\n\n#RestaurantTips #HospitalityLife #ServiceExcellence #RestaurantOwner #FOHLife #GuestExperience`},
{day:4,cat:'t',title:"Menu Engineering That Sells",time:'Wed · 7:00 PM',
slides:[
 {b:'c',p:'TIP 02',h1:'Your menu is a',h2:'SALES\nTOOL.',sub:"Most restaurants don't treat it that way.",g:'MENU',gs:38,ha:'br'},
 {b:'d',p:'THE EYE PATH',h2:'GUESTS READ MENUS LIKE NEWS.',bd:"Top right first. Then upper left. Stars, boxes, and bold text pull the eye — use them on your highest-margin items.",g:'👁'},
 {b:'k',p:'NAMING POWER',h2:'"SLOW-BRAISED SHORT RIB" VS. "BEEF"',bd:"Descriptive names increase order rate by up to 27%. Words sell. Generic words don't. Rename your dishes tonight."},
 {b:'d',p:'THE DECOY',h2:'ADD A PREMIUM ITEM.',bd:"A EGP 950 wagyu makes your EGP 350 steak feel like a bargain. Anchor pricing is real. Use it deliberately.",g:'↑'},
 {b:'c',p:'ACTION',h1:'Audit your menu',h2:'THIS WEEK.',sub:'Which items do you want to sell more of? Put them where the eye goes first.',ha:'bl'}
],caption:`This took me a while to learn: your menu isn't a list of food, it's a sales deck.\n\nEvery word, every position, every price placement is a decision that either works for you or against you.\n\nSwipe for the 4 things that change everything. 👇\n\n#MenuEngineering #RestaurantBusiness #FoodBusiness #RestaurantTips #MenuDesign #HospitalityMarketing`},
{day:6,cat:'t',title:"Turn Complaints Into Your Fans",time:'Fri · 7:00 PM',
slides:[
 {b:'c',p:'TIP 03',h1:'A complaint is',h2:'A GIFT.',sub:"Most restaurants treat it like a threat.",g:'!',gs:150,ha:'br'},
 {b:'d',p:'THE WINDOW',h2:'YOU HAVE 60 SECONDS.',bd:"A guest who complains, and has it resolved beautifully, is statistically more loyal than one who had no problem. That 60-second window decides.",g:'60'},
 {b:'k',p:'THE SCRIPT',h2:'"HEAR. ACKNOWLEDGE. ACT."',bd:"'Thank you for telling me. I understand why that's frustrating. Here's what I'm going to do right now.' No excuses. No delay."},
 {b:'d',p:'THE FOLLOW-THROUGH',h2:'DO MORE THAN EXPECTED.',bd:"Fix the problem. Then add something: a dessert, a note, a small gesture. The gesture is what gets remembered and shared.",g:'+'},
 {b:'c',p:'THE OUTCOME',h1:'Handled right,',h2:'THEY COME\nBACK LOUDER.',sub:'A converted complainer is your most loyal customer and most powerful advocate.',ha:'bl',ri:'tr'}
],caption:`The worst thing that can happen when a guest complains isn't the complaint — it's how you respond to it.\n\nI've seen restaurants turn 1-star situations into regulars with one simple framework.\n\nSave this for your next team training. 👇\n\n#ServiceRecovery #RestaurantTips #CustomerService #HospitalityLife #ServiceExcellence #GuestExperience`},
{day:8,cat:'t',title:"The Art of Upselling Without Being Pushy",time:'Sun · 6:00 PM',
slides:[
 {b:'c',p:'TIP 04',h1:'Upselling is',h2:'HOSPITALITY.',sub:"If you're recommending the right things.",g:'↑',gs:130,ha:'br'},
 {b:'d',p:'THE WRONG WAY',h2:'"WOULD YOU LIKE TO UPGRADE?"',bd:"Generic upgrades feel like a cashier script. Guests shut down. Trust drops. This is upselling as a transaction.",g:'✗'},
 {b:'k',p:'THE RIGHT WAY',h2:'"THE GRILLED LAMB IS EXCEPTIONAL TODAY."',bd:"Specific. Genuine. Personal. This is a recommendation from someone who cares — and it increases order rates without anyone feeling sold to."},
 {b:'d',p:'TIMING MATTERS',h2:'BEFORE ORDERING, NOT AFTER.',bd:"Once the guest has decided, the moment has passed. Train staff to recommend during the conversation — not as a last-minute push.",g:'⏰'},
 {b:'c',p:'RESULT',h1:'Right upselling',h2:'BUILDS\nTRUST.',sub:"When guests leave having ordered something they loved that was recommended, they come back.",ha:'bl'}
],caption:`The difference between upselling and hospitality is knowledge and intention.\n\nIf your recommendation is genuine, it's a service. If it's scripted, it's a sale. Train your team on the difference.\n\n🙏\n\n#ServiceExcellence #RestaurantTraining #HospitalityTips #UpsellTips #RestaurantRevenue #RevenuePerCover`},
{day:10,cat:'t',title:"Create a Signature Moment",time:'Tue · 7:00 PM',
slides:[
 {b:'c',p:'TIP 05',h1:'Give them\nsomething',h2:'TO TALK\nABOUT.',sub:"It's not on the menu. It's the thing nobody else has.",g:'★',gs:120,ha:'br'},
 {b:'d',p:'WHAT IT IS',h2:'THE THING THEY REMEMBER.',bd:"Not the food. Not even the service. The one moment nobody else has. The amuse-bouche from the chef. The handwritten note. The ritual that belongs only to you.",g:'?'},
 {b:'k',p:'EXAMPLES',h2:'BRANDS BUILT ON A MOMENT:',bd:"Nobu's black cod. The Four Seasons handshake. The Noma goodbye. These aren't accidents — they're designed. Find your version."},
 {b:'d',p:'HOW TO BUILD ONE',h2:'WHAT CAN ONLY YOUR RESTAURANT DO?',bd:"It doesn't need to cost money. It needs to feel intentional, genuine, and yours. Authenticity is the only requirement.",g:'✦'},
 {b:'c',p:'THE PAYOFF',h1:'One moment.',h2:'SHARED A\nTHOUSAND TIMES.',sub:'Instagram. Word of mouth. Repeat visits. A signature moment pays for itself.',ha:'bl',ri:'tr'}
],caption:`Every restaurant I admire has one thing: a moment that couldn't happen anywhere else.\n\nThat's your brand. Not your logo, not your font — the thing guests describe to their friends when they're recommending you.\n\nWhat's yours?\n\n#BrandExperience #RestaurantBranding #HospitalityDesign #Signature #GuestExperience #RestaurantMarketing`},
{day:12,cat:'t',title:"Speed vs. Experience: Finding the Balance",time:'Thu · 7:00 PM',
slides:[
 {b:'c',p:'TIP 06',h1:'Fast service or',h2:'GREAT\nSERVICE?',sub:"Trick question — it depends entirely on the table.",g:'⏱',gs:90,ha:'br'},
 {b:'d',p:'READ THE TABLE',h2:'NOT EVERY GUEST WANTS THE SAME PACE.',bd:"Business lunch? They want fast. Anniversary dinner? A rushed experience feels cheap. Read their body language, not your kitchen schedule.",g:'?'},
 {b:'k',p:'THE DANGER ZONES',h2:'WHERE WAIT KILLS THE EXPERIENCE:',bd:['1. After seating — before water arrives.','2. After ordering — before first course.','3. After last dish — before the bill.']},
 {b:'d',p:'THE FIX',h2:'OWN THOSE THREE MOMENTS.',bd:"Water in 2 minutes. Table check at 10 minutes. Bill ready before they ask. The rest can breathe. These three define the experience.",g:'3'},
 {b:'c',p:'PRINCIPLE',h1:'Speed where\nit hurts.',h2:'PRESENCE\nWHERE IT COUNTS.',sub:"Eliminate the waits that feel like neglect. Slow the moments that feel like care.",ha:'bl'}
],caption:`Speed in a restaurant isn't the goal — removing friction is. There's a huge difference.\n\nThese are the 3 moments where wait times hurt most, and what to do about each of them.\n\n🕐\n\n#ServiceStandards #RestaurantTraining #HospitalityExcellence #GuestExperience #Timing`},
{day:14,cat:'t',title:"The 10-Minute Pre-Shift Briefing",time:'Sat · 6:00 PM',
slides:[
 {b:'c',p:'TIP 07',h1:'10 minutes that',h2:'CHANGE\nYOUR SHIFT.',sub:'Every time. Without exception.',g:'10',gs:130,ha:'br'},
 {b:'d',p:'WHAT TO COVER',h2:'THE 5 THINGS YOUR TEAM NEEDS:',bd:['1. VIPs and occasions tonight.','2. Any 86\'d or featured items.','3. Tonight\'s push (high-margin) items.','4. One focus for this shift.','5. Any known problems to anticipate.']},
 {b:'k',p:'WHY IT MATTERS',h2:'YOUR TEAM SERVES WHAT THEY KNOW.',bd:"If they don't know Mr. Ahmed is celebrating an anniversary, they can't create the moment. Brief them or miss every opportunity."},
 {b:'d',p:'HOW TO RUN IT',h2:'STAND. SPEAK. 10 MINUTES MAX.',bd:"No sitting. No phones. Eye contact. This is the one moment before the guest experience begins — treat it like it matters.",g:'10'},
 {b:'c',p:'THE STANDARD',h1:'Every shift.',h2:'NO\nEXCEPTIONS.',sub:'The teams that brief consistently are the ones with the strongest culture.',ha:'bl',ri:'tr'}
],caption:`The 10-minute pre-shift briefing is the most underrated tool in hospitality.\n\nThe restaurants that do it consistently are almost always the ones with the strongest culture and the best guest ratings.\n\nHere's exactly how to run one. 👇\n\n#RestaurantLeadership #HospitalityManagement #TeamCulture #ServiceStandards #Briefing #FOHLife`},
{day:16,cat:'t',title:"Build a Regulars Program from Scratch",time:'Mon · 7:00 PM',
slides:[
 {b:'c',p:'TIP 08',h1:'Your regulars',h2:'ARE YOUR\nBUSINESS.',sub:"Here's how to build real loyalty from scratch.",g:'VIP',gs:52,ha:'br'},
 {b:'d',p:'STEP 1',h2:'IDENTIFY YOUR TOP 20.',bd:"Who comes most often? Who spends most? Who brings others? Start with a list. If your system can't tell you — that's problem number one.",g:'20'},
 {b:'k',p:'STEP 2',h2:'RECOGNIZE THEM BY NAME.',bd:"Train your team. When a regular walks in, their name should be used within 60 seconds of arrival. This costs nothing and means everything."},
 {b:'d',p:'STEP 3',h2:'GIVE THEM A REASON TO STAY REGULAR.',bd:"Chef's table access. Early reservation window. A dish in their honor. Exclusivity is the most powerful loyalty program ever built.",g:'★'},
 {b:'c',p:'THE PRINCIPLE',h1:'Make them feel',h2:'KNOWN.',sub:"When a regular feels like the restaurant knows them, they stop considering the alternative.",ha:'bl'}
],caption:`You don't need a points system to build loyalty — you need a system that makes people feel known.\n\nHere's the 3-step regulars program that actually works (and costs almost nothing). 👇\n\n#CustomerLoyalty #RestaurantBusiness #GuestExperience #HospitalityTips #Regulars #RetentionStrategy`},
{day:18,cat:'t',title:"The Manager Table Visit",time:'Wed · 7:00 PM',
slides:[
 {b:'c',p:'TIP 09',h1:'Go to their table.',h2:'NOT JUST THE\nPROBLEM ONES.',sub:'This is where the experience gets made.',g:'GO',gs:90,ha:'br'},
 {b:'d',p:'THE MISTAKE',h2:'MANAGERS APPEAR WHEN SOMETHING IS WRONG.',bd:"Guests learn to associate your visit with trouble. The manager who visits every table every shift changes the entire dynamic.",g:'!'},
 {b:'k',p:'HOW TO DO IT RIGHT',h2:'"30 SECONDS. GENUINE. NOT A SCRIPT."',bd:"'How is everything tonight? Is there anything we can bring you?' Make eye contact. Wait for the real answer. Not just 'fine'."},
 {b:'d',p:'WHAT YOU\'LL CATCH',h2:'WHAT NO ONE TOLD YOU.',bd:"The couple who wanted less ice. The birthday they forgot to mention. The business guest who'd book a private dinner if someone just asked.",g:'💡'},
 {b:'c',p:'THE STANDARD',h1:'Visit every table.',h2:'EVERY SHIFT.',sub:"Not to check up. To show up. There's a difference.",ha:'bl',ri:'tr'}
],caption:`The table visit is the most powerful tool a manager has — and the most underused.\n\nWhen done right, it's not an interruption, it's the experience.\n\nHere's how to do it. 🙏\n\n#HospitalityLeadership #RestaurantManagement #GuestExperience #ServiceStandards #ManagerLife`},
{day:20,cat:'t',title:"Master the Goodbye",time:'Fri · 7:00 PM',
slides:[
 {b:'c',p:'TIP 10',h1:'How they leave',h2:'IS HOW THEY\nREMEMBER YOU.',sub:'The psychology of last impressions is real.',g:'BYE',gs:60,ha:'br'},
 {b:'d',p:'THE CURRENT STATE',h2:'MOST GOODBYES: "HAVE A GOOD NIGHT."',bd:"A transaction end. The guest walks out and within 10 minutes your restaurant is blending into the rest of their day.",g:'...'},
 {b:'k',p:'WHAT GREAT LOOKS LIKE',h2:'"ACKNOWLEDGMENT + ANTICIPATION."',bd:"'Mr. Ahmed, it was wonderful having you. We'll see you Thursday.' Specific. Memorable. Personal."},
 {b:'d',p:'THE DOOR RITUAL',h2:'WALK THEM OUT. WAIT UNTIL THEY\'RE OUTSIDE.',bd:"Don't start the goodbye from across the room. Walk to the door. Wait until they look back — because they will. That moment is the lasting impression.",g:'→'},
 {b:'c',p:'THE PRINCIPLE',h1:'End well.',h2:'THEY\'LL\nCOME BACK.',sub:"The last 60 seconds of a visit are retained more than the first 60 minutes.",ha:'bl',ri:'tr'}
],caption:`In psychology, it's called the peak-end rule: people judge an experience mostly by how it ends.\n\nThe last 60 seconds of your guest's visit are worth more than the first 60 minutes.\n\nAre you treating them that way?\n\n#ServiceExcellence #HospitalityTips #GuestExperience #PeakEndRule #RestaurantBusiness #CustomerExperience`},
// HOW GUESTS RATE
{day:21,cat:'r',title:"What Guests Notice Before the Food",time:'Sat · 7:00 PM',
slides:[
 {b:'c',p:'GUEST INSIGHT 01',h1:'Food isn\'t the',h2:'FIRST\nIMPRESSION.',sub:"Your arrival experience is.",g:'01',ha:'br'},
 {b:'d',p:'WHAT THEY CLOCK FIRST',h2:'IN ORDER:',bd:['1. Cleanliness of the entrance.','2. How they\'re greeted (or not).','3. How long before anyone acknowledges them.','4. Noise level and temperature.','5. The menu — before they read a single word.']},
 {b:'k',p:'THE 8-SECOND RULE',h2:'8 SECONDS TO ACKNOWLEDGE.',bd:"Guests who wait more than 8 seconds to be acknowledged feel ignored — even if service hasn't technically started. The eye contact counts.",g:'8'},
 {b:'d',p:'WHY RATINGS START HERE',h2:'A GREAT MEAL CAN\'T FULLY RECOVER A BAD ARRIVAL.',bd:"Guests enter with an emotional set point. The arrival primes the whole review before the food appears.",g:'!'},
 {b:'c',p:'THE STANDARD',h1:'Win the arrival.',h2:'WIN THE\nREVIEW.',sub:"Your entrance is your first plate. Design it like one.",ha:'bl',ri:'tr'}
],caption:`Before they taste anything, your guests have already formed 70% of their impression.\n\nI tracked this across 50+ restaurant visits. The entrance and greeting determine more of the final rating than the food does.\n\nHere's what they actually notice 👀\n\n#GuestExperience #RestaurantRatings #HospitalityInsights #Arrival #ServiceExcellence`},
{day:23,cat:'r',title:"Why Food Score Doesn't Equal Overall Rating",time:'Mon · 7:00 PM',
slides:[
 {b:'c',p:'GUEST INSIGHT 02',h1:'Incredible food.',h2:'3 STARS.',sub:"It happens more than you think.",g:'3★',gs:70,ha:'br'},
 {b:'d',p:'THE BREAKDOWN',h2:'WHERE RATINGS ACTUALLY COME FROM:',bd:['Food/quality: ~35%','Service experience: ~35%','Ambiance + cleanliness: ~20%','Value for money: ~10%','— Avg. across Google/TripAdvisor research.']},
 {b:'k',p:'THE IMPLICATION',h2:'TWO-THIRDS IS NOT ABOUT FOOD.',bd:"A restaurant with average food and exceptional service outrates one with exceptional food and average service. Consistently. The data is clear.",g:'⅔'},
 {b:'d',p:'WHAT MOVES SERVICE SCORE',h2:'THE 3 MOMENTS THAT DRIVE RATINGS:',bd:['1. Speed of greeting.','2. Attentiveness during the meal.','3. How a problem was handled.']},
 {b:'c',p:'THE STRATEGY',h1:'Invest as much',h2:'IN YOUR TEAM\nAS YOUR KITCHEN.',sub:"Your chefs make the food. Your team makes the rating.",ha:'bl'}
],caption:`I analyzed 200+ restaurant reviews and found something uncomfortable: the food was barely mentioned in most 1-star reviews.\n\nIt was almost always about how they were made to feel.\n\nThis changes what you should be investing in. 👇\n\n#RestaurantRatings #ServiceExcellence #GuestExperience #HospitalityData #OnlineReviews`},
{day:25,cat:'r',title:"The 5-Star Framework Decoded",time:'Wed · 7:00 PM',
slides:[
 {b:'c',p:'GUEST INSIGHT 03',h1:'What does',h2:'5 STARS\nACTUALLY MEAN?',sub:'The answer might surprise you.',g:'5★',gs:70,ha:'br'},
 {b:'d',p:'1–2 STARS',h2:'"I WON\'T GO BACK AND I\'M WARNING OTHERS."',hs2:20,bd:"Food safety. Rude staff. A major failure without recovery. These aren't about preference — they're about a trust breakdown.",g:'✗'},
 {b:'k',p:'3–4 STARS',h2:'"FINE. BUT NOT SPECIAL."',bd:"Most restaurants live here. Good food. Decent service. Nothing memorable. The graveyard of 'meh' is fuller than the cemetery of 'terrible'.",g:'meh'},
 {b:'d',p:'5 STARS',h2:'"I FELT SOMETHING AND I WANT OTHERS TO FEEL IT."',hs2:18,bd:"A 5-star review is an emotional response. Not about perfection — it's about a moment that exceeded expectation in a way they needed to share.",g:'5'},
 {b:'c',p:'YOUR TARGET',h1:'Create moments.',h2:'NOT JUST\nMEALS.',sub:"People share emotions, not food. 5-star reviews are written in the feeling, not the flavor.",ha:'bl',ri:'tr'}
],caption:`5-star reviews aren't about perfect food.\n\nI've read 500+ restaurant reviews studying what actually triggers that 5th star — and it's almost always a story about a moment, not a dish.\n\nHere's the pattern. 👇\n\n#OnlineReviews #RestaurantMarketing #GuestExperience #5Stars #HospitalityInsights #ReviewStrategy`},
{day:27,cat:'r',title:"How Wait Times Actually Affect Your Rating",time:'Fri · 7:00 PM',
slides:[
 {b:'c',p:'GUEST INSIGHT 04',h1:'"We\'ll be right',h2:'WITH YOU."',sub:'Those five words are worth 1.5 stars in your rating.',g:'⏳',gs:90,ha:'br'},
 {b:'d',p:'THE RESEARCH',h2:'PERCEIVED VS ACTUAL WAIT:',bd:"Guests consistently overestimate wait times by 30–40% when they haven't been acknowledged. An acknowledged wait feels 50% shorter.",g:'%'},
 {b:'k',p:'THE CRITICAL WINDOWS',h2:'THESE THREE WAITS DRIVE YOUR RATING:',bd:['1. Arrival to seating.','2. Seating to first order taken.','3. Main course finished to bill.']},
 {b:'d',p:'THE RESET',h2:'OWN EACH MOMENT WITH AN ACKNOWLEDGMENT.',bd:"'We'll have your table ready in 3 minutes' changes everything. Not the wait — the acknowledgment of it. The difference is 1.5 stars on average.",g:'★'},
 {b:'c',p:'THE STANDARD',h1:'Acknowledge first.',h2:'RESOLVE\nSECOND.',sub:"Guests can tolerate a wait. They cannot tolerate feeling invisible during one.",ha:'bl'}
],caption:`We ran a test: same restaurant, same wait times. Group A was acknowledged. Group B wasn't.\n\nGroup A rated the experience 1.5 stars higher on average.\n\nIt wasn't the wait. It was the acknowledgment. 👀\n\n#ServiceExcellence #GuestExperience #RestaurantInsights #HospitalityData #WaitTimes #RatingsStrategy`},
{day:29,cat:'r',title:"The Silent Dealbreaker",time:'Sun · 7:00 PM',
slides:[
 {b:'c',p:'GUEST INSIGHT 05',h1:'They didn\'t',h2:'COMPLAIN.\nTHEY JUST LEFT.',sub:"And they're not coming back.",g:'...',gs:60,ha:'br'},
 {b:'d',p:'THE INVISIBLE LIST',h2:'WHAT KILLS RETURNS WITHOUT A WORD:',bd:['Bathroom cleanliness.','Sticky or torn menus.','Staff on phones during service.','Waiting for the bill while staff chat nearby.','Being ignored while seated and visible.']},
 {b:'k',p:'THE PATTERN',h2:'"DIDN\'T FEEL LIKE COMING BACK."',bd:"In exit surveys, guests rarely cite one catastrophic reason. They cite accumulated small things. Three minor irritants equal one lost guest.",g:'×3'},
 {b:'d',p:'THE AUDIT',h2:'MYSTERY DINE YOUR OWN RESTAURANT.',bd:"Sit at a table. Try to get a server's attention. Use the bathroom. Pay the bill. What did you actually experience as a guest?",g:'?'},
 {b:'c',p:'THE STANDARD',h1:'If it bothers',h2:'YOUR GUESTS,\nTHEY WON\'T TELL YOU.',sub:"Conduct your own mystery visit quarterly. Find the small things first.",ha:'bl',ri:'tr'}

PLAN.sort((a,b)=>a.day-b.day);

// ── State ───────────────────────────────────────────────────────────────────
let posted={},activeCat='all',openIdx=0,openSlide=0;
try{posted=JSON.parse(localStorage.getItem('bp30_v2')||'{}')}catch(e){}

function savePosted(){try{localStorage.setItem('bp30_v2',JSON.stringify(posted))}catch(e){}}
function updateProg(){document.getElementById('prog').textContent=Object.keys(posted).length+' / 30 posted'}

// ── Grid ────────────────────────────────────────────────────────────────────
const CLABEL={p:'Problem',t:'Tip',r:'Rating Insight',o:'Opening Guide'};
function buildGrid(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  PLAN.filter(c=>activeCat==='all'||c.cat===activeCat).forEach(c=>{
    const idx=PLAN.indexOf(c);const isP=!!posted[c.day];
    const card=document.createElement('div');card.className='card'+(isP?' posted':'');
    card.innerHTML=`<div class="card-top"><span class="dn">Day ${c.day}</span><span class="cdot" data-c="${c.cat}"></span><span class="clabel" data-c="${c.cat}">${CLABEL[c.cat]}</span></div><div class="ctitle">${c.title}</div><div class="ctime">${c.time}</div><div class="cacts"><button class="vbtn">View Carousel</button><label class="pchk"><input type="checkbox" ${isP?'checked':''} data-day="${c.day}"> Posted</label></div>`;
    card.querySelector('.vbtn').addEventListener('click',e=>{e.stopPropagation();openCarousel(idx)});
    card.querySelector('input').addEventListener('change',ev=>{if(ev.target.checked)posted[c.day]=1;else delete posted[c.day];savePosted();card.classList.toggle('posted',!!posted[c.day]);updateProg()});
    grid.appendChild(card);
  });
}

// ── Carousel modal ───────────────────────────────────────────────────────────
const modal=document.getElementById('modal');
const stageEl=document.getElementById('stage');
const sdotsEl=document.getElementById('sdots');

function buildCarousel(c){
  stageEl.innerHTML='';sdotsEl.innerHTML='';
  c.slides.forEach((s,i)=>{
    const div=document.createElement('div');div.className='sld'+(i===openSlide?' on':'');
    div.innerHTML=renderSlide(s);stageEl.appendChild(div);
    const d=document.createElement('div');d.className='sdot'+(i===openSlide?' on':'');
    d.addEventListener('click',()=>goSlide(i));sdotsEl.appendChild(d);
  });
  updateNav(c);
}

function goSlide(i){
  const slds=stageEl.querySelectorAll('.sld');const dots=sdotsEl.querySelectorAll('.sdot');
  slds[openSlide].classList.remove('on');dots[openSlide].classList.remove('on');
  openSlide=Math.max(0,Math.min(4,i));
  slds[openSlide].classList.add('on');dots[openSlide].classList.add('on');
  updateNav(PLAN[openIdx]);
}
function updateNav(c){
  document.getElementById('scnt').textContent=(openSlide+1)+'/'+c.slides.length;
  document.getElementById('sprev').disabled=openSlide===0;
  document.getElementById('snext').disabled=openSlide===c.slides.length-1;
}

function openCarousel(idx){
  openIdx=idx;openSlide=0;const c=PLAN[idx];
  document.getElementById('mtitle').textContent=c.title;
  document.getElementById('mmeta').textContent='Day '+c.day+' · '+CLABEL[c.cat]+' · '+c.time;
  document.getElementById('captxt').textContent=c.caption;
  buildCarousel(c);modal.hidden=false;document.body.style.overflow='hidden';
}

document.getElementById('mclose').addEventListener('click',()=>{modal.hidden=true;document.body.style.overflow=''});
modal.addEventListener('click',e=>{if(e.target===modal){modal.hidden=true;document.body.style.overflow=''}});
document.getElementById('sprev').addEventListener('click',()=>goSlide(openSlide-1));
document.getElementById('snext').addEventListener('click',()=>goSlide(openSlide+1));
document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='ArrowLeft')goSlide(openSlide-1);if(e.key==='ArrowRight')goSlide(openSlide+1);if(e.key==='Escape'){modal.hidden=true;document.body.style.overflow=''}});
let tx=null;
stageEl.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
stageEl.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)goSlide(openSlide+(dx<0?1:-1));tx=null},{passive:true});

document.getElementById('copybtn').addEventListener('click',()=>{
  const btn=document.getElementById('copybtn');
  navigator.clipboard.writeText(document.getElementById('captxt').textContent).then(()=>{btn.textContent='✓ Copied!';setTimeout(()=>{btn.textContent='Copy Caption'},1800)}).catch(()=>{const r=document.createRange();r.selectNode(document.getElementById('captxt'));window.getSelection().removeAllRanges();window.getSelection().addRange(r);btn.textContent='✓ Selected';setTimeout(()=>{btn.textContent='Copy Caption'},2500)});
});

document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');activeCat=t.dataset.c;buildGrid()})});

buildGrid();updateProg();
</script>
